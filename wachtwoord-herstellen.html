<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Wachtwoord herstellen | Uitgesproken</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <style>
    .reset-form { display: grid; gap: 1rem; max-width: 420px; margin-top: 1.5rem; }
    .reset-form label { display: grid; gap: 0.35rem; font-size: 0.95rem; }
    .reset-form input {
      padding: 0.85rem 1rem;
      border-radius: 10px;
      border: 1.5px solid var(--cream);
      background: transparent;
      color: var(--cream);
      font-family: inherit;
      font-size: 1rem;
    }
    .reset-form button {
      padding: 0.85rem 1rem;
      border-radius: 999px;
      border: 0;
      background: var(--cream);
      color: var(--bg);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .reset-form button:disabled { opacity: 0.6; cursor: default; }
    .reset-message { margin-top: 1rem; color: var(--cream); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="legal">
    <a class="back" href="index.html">&larr; Terug naar Uitgesproken</a>
    <h1>Wachtwoord herstellen</h1>

    <p id="status">Even geduld, je herstellink wordt gecontroleerd...</p>

    <form id="reset-form" class="reset-form" hidden>
      <label>
        Nieuw wachtwoord
        <input id="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
      </label>
      <label>
        Herhaal nieuw wachtwoord
        <input id="confirm" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
      </label>
      <button id="submit" type="submit">Wachtwoord opslaan</button>
    </form>

    <p id="message" class="reset-message" role="status" aria-live="polite"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script>
    // Het Supabase-project van de app (zelfde waarden als src/utils/supabaseInfo.ts in de app; de anon key is publiek).
    const SUPABASE_URL = 'https://hcqwkomuzerlztibcojz.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhjcXdrb211emVybHp0aWJjb2p6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMTk3MDUsImV4cCI6MjA5NjU5NTcwNX0.r9Qzb6IOj3k7rsEuQuRXE6w_82NUyu-2RZqW2314BWU';

    const statusEl = document.getElementById('status');
    const form = document.getElementById('reset-form');
    const messageEl = document.getElementById('message');
    const submitEl = document.getElementById('submit');

    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { detectSessionInUrl: true, persistSession: false, autoRefreshToken: false },
    });

    function showForm() {
      statusEl.textContent = 'Kies een nieuw wachtwoord voor je Uitgesproken-account.';
      form.hidden = false;
    }

    function showLinkError() {
      statusEl.textContent = 'Deze herstellink is verlopen of al gebruikt. Vraag in de app een nieuwe aan via "Wachtwoord vergeten?".';
    }

    async function init() {
      const hash = new URLSearchParams(window.location.hash.slice(1));
      const query = new URLSearchParams(window.location.search);

      if (hash.get('error') || query.get('error')) {
        showLinkError();
        return;
      }

      // Variant met token_hash in de link (eigen e-mailtemplate); de standaardlink zet de sessie in de URL-hash.
      const tokenHash = query.get('token_hash');
      if (tokenHash) {
        const { error } = await client.auth.verifyOtp({ token_hash: tokenHash, type: 'recovery' });
        if (error) { showLinkError(); return; }
        showForm();
        return;
      }

      const { data } = await client.auth.getSession();
      if (data.session) showForm();
      else showLinkError();
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      messageEl.textContent = '';
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;

      if (password !== confirm) {
        messageEl.textContent = 'De wachtwoorden komen niet overeen.';
        return;
      }
      if (password.length < 8 || !/\d/.test(password) || !/[a-zA-Z]/.test(password)) {
        messageEl.textContent = 'Gebruik minimaal 8 tekens, met ten minste een letter en een cijfer.';
        return;
      }

      submitEl.disabled = true;
      submitEl.textContent = 'Bezig...';
      const { error } = await client.auth.updateUser({ password });
      if (error) {
        messageEl.textContent = 'Opslaan is niet gelukt. Probeer het opnieuw of vraag een nieuwe herstellink aan.';
        submitEl.disabled = false;
        submitEl.textContent = 'Wachtwoord opslaan';
        return;
      }

      await client.auth.signOut();
      form.hidden = true;
      statusEl.textContent = 'Je wachtwoord is gewijzigd. Je kunt nu inloggen in de app met je nieuwe wachtwoord.';
      history.replaceState(null, '', window.location.pathname);
    });

    init().catch(showLinkError);
  </script>
</body>
</html>
